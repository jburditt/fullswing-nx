name: fullswing-blog
metadata:
  template: static-web-app@0.1.0

resourceGroup: rg-fullswing-blog

infra:
  provider: bicep
  path: infra

hooks:
  preprovision:
    shell: sh
    run: ./scripts/ensure-resource-group.sh
  postdown:
    shell: sh
    run: ./scripts/delete-resource-group.sh

services:
  web:
    project: ./apps/fullswing-blog
    language: js
    host: staticwebapp
    dist: dist
    hooks:
      prepackage:
        shell: sh
        run: npm run build
