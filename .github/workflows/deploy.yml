name: Deploy Static Web App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'up (provision + deploy) or down (destroy)'
        required: true
        default: 'up'
        type: choice
        options: [up, down]

permissions:
  id-token: write
  contents: read

jobs:
  azd:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: fullswing-blog
      AZURE_LOCATION: westus2
      AZURE_RESOURCE_GROUP: rg-fullswing-blog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: Azure/setup-azd@v2

      - name: Log in with federated credentials
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider "github" --tenant-id "$AZURE_TENANT_ID"

      - name: Log in with Azure CLI (Federated Credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        if: github.event_name == 'push' || inputs.action == 'up'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ensure-resource-group.sh
          azd provision --no-prompt
          # Azure Resource Graph lags behind ARM tag writes; give it time to index before deploy looks up the tagged resource.
          sleep 30
          azd deploy --no-prompt

      - name: Destroy
        if: inputs.action == 'down'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(az group exists --name "$AZURE_RESOURCE_GROUP" --output tsv)" == "true" ]]; then
            azd down --force --purge
            ./scripts/delete-resource-group.sh
          else
            unexpected_resource_ids="$(
              azd env get-values --environment "$AZURE_ENV_NAME" |
                grep '^SERVICE_.*_RESOURCE_ID=' |
                grep -vi "/resourceGroups/$AZURE_RESOURCE_GROUP/" || true
            )"

            if [[ -n "$unexpected_resource_ids" ]]; then
              echo "Refusing to remove azd environment state because it references resources outside $AZURE_RESOURCE_GROUP:" >&2
              echo "$unexpected_resource_ids" >&2
              exit 1
            fi

            echo "Resource group $AZURE_RESOURCE_GROUP is already absent and the azd environment only references resources under it; removing the azd environment state."
            azd env remove "$AZURE_ENV_NAME" --force
          fi
